<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rexan &mdash; Coming Soon</title>
  <meta name="description" content="Something new is taking shape. A fresh digital experience by Jainam Shah is currently in the works.">
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080a10;
      --card-bg: rgba(18, 22, 34, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --accent: #38bdf8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Background Effects */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(56, 189, 248, 0.06) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatAura 12s ease-in-out infinite alternate;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    }

    @keyframes floatAura {
      0% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -52%) scale(1.08);
        opacity: 1;
      }
    }

    /* Top Brand Nav */
    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 680px;
      text-align: center;
      z-index: 10;
      margin: auto 0;
      padding: 3rem 0;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 0.35rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.3s ease;
    }

    .status-badge:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--success);
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background-color: var(--success);
      opacity: 0.45;
      animation: pulse 2s infinite ease-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 0.7;
      }
      70% {
        transform: scale(2.2);
        opacity: 0;
      }
      100% {
        transform: scale(0.9);
        opacity: 0;
      }
    }

    /* Typography */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 6vw, 3.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.tagline {
      font-size: clamp(1.05rem, 2.5vw, 1.2rem);
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 540px;
      margin: 0 auto 2.5rem;
      font-weight: 400;
    }

    /* Interactive Connect Section */
    .links-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 1.75rem 2rem;
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .links-card:hover {
      border-color: var(--card-border-hover);
    }

    .links-label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 1.15rem;
    }

    .connect-grid {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-connect {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      text-decoration: none;
      padding: 0.65rem 1.15rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-connect svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.25s ease;
    }

    .btn-connect:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-connect:hover svg {
      transform: scale(1.1);
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1000px;
      text-align: center;
      z-index: 10;
      padding-top: 2rem;
    }

    footer p {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--text-main);
    }

    @media (max-width: 540px) {
      .connect-grid {
        flex-direction: column;
      }
      .btn-connect {
        justify-content: center;
        width: 100%;
      }
      .links-card {
        padding: 1.5rem 1.25rem;
      }
    }
  </style>
</head>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Rexan &bull; Jainam Shah</p>
  </footer>

</body>
</html>
